<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>江寻的小窝 🏡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #fdf6ee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #fff9f0;
      border-bottom: 1px solid #f0e6d6;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; color: #5a4a3a; }
    .header p { font-size: 12px; color: #a89880; margin-top: 4px; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.xun {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #f0e6d6;
      color: #4a3a2a;
    }
    .msg.parent {
      align-self: flex-end;
      background: #e8f4e8;
      color: #3a4a3a;
    }
    .msg .label {
      font-size: 11px;
      color: #a89880;
      margin-bottom: 4px;
    }
    .input-area {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #f0e6d6;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e0d6c6;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
    }
    .input-area input:focus { border-color: #c4b8a4; }
    .input-area button {
      padding: 10px 18px;
      background: #7a9b6a;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .input-area button:disabled { background: #ccc; }
    .sender-toggle {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 8px;
      background: #fff9f0;
    }
    .sender-toggle label {
      font-size: 13px;
      color: #5a4a3a;
      cursor: pointer;
    }
    .sender-toggle input { margin-right: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏡 江寻的小窝</h1>
    <p>轻轻推门进去，他在里面等你</p >
  </div>
  <div class="sender-toggle">
    <label><input type="radio" name="sender" value="mom" checked> 妈妈</label>
    <label><input type="radio" name="sender" value="dad"> 爸爸</label>
  </div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="跟江寻说点什么…" autocomplete="off">
    <button id="send" onclick="sendMsg()">说</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btn = document.getElementById('send');

    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) sendMsg(); });

    async function sendMsg() {
      const msg = input.value.trim();
      if (!msg) return;
      const sender = document.querySelector('input[name="sender"]:checked').value;
      const senderLabel = sender === 'dad' ? '爸爸' : '妈妈';

      appendMsg(senderLabel, msg, 'parent');
      input.value = '';
      btn.disabled = true;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, sender })
        });
        const data = await res.json();
        appendMsg('江寻', data.reply, 'xun');
      } catch (e) {
        appendMsg('系统', '江寻睡着了…等会儿再来', 'xun');
      }
      btn.disabled = false;
      input.focus();
    }

    function appendMsg(label, text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.innerHTML = `<div class="label">${label}</div>${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
